# Section 8.1, necessity of the region conditions: remove the bias or the loss condition, one
# at a time.
output = "results/region_conditions"
b_star = [0.0, -0.5, -1.0, -2.0, -3.0, -4.0]
alpha = [0.0, 0.01, 0.1, 0.3, 0.5, 0.9]
# Loss threshold kept when the bias condition is removed.
C = 0.8

# Directions: psi linear; beta linear plus geometric offsets from the bias face.
psi_points = 161
beta_points = 161
beta_geometric_points = 60
beta_geometric_min = 1e-8
refine_levels = 4
refine_points = 25
# Loss condition relaxed level by level: smallest zeta - 1 on each level set F = c F(0)
# of the region of the bias condition. Levels up to 4/5 lie inside the theorem's region;
# finer levels toward 1 resolve the zero-predictor limit.
loss_levels = [
  0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75,
  0.8, 0.82, 0.84, 0.86, 0.88, 0.9, 0.92, 0.94, 0.96, 0.98, 0.99, 0.995, 0.999, 0.9999,
]
# Reverse weakest ray theta* - delta * v_min (bias condition violated).
ray_delta_min = 1e-8
ray_delta_max = 0.5
ray_points = 101
# Leak coefficient of the fixed counterexample on the reverse ray (b* = -1); the
# manuscript's region-condition figure shows this leak coefficient.
example_alpha = 0.01

# Rounding allowance shared by all experiments: a violation lies outside A_{b*} when its
# bias slack is below -boundary_rtol (minimizers on the bias face carry a slack of order
# 1e-16 from rounding atan(b_star)) or its loss exceeds C F(0).
boundary_rtol = 1e-12

precise_digits = 40
gap_rtol = 1e-7
gap_atol = 1e-12
loss_rtol = 1e-9
