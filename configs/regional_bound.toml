# Section 8.1, regional lower bound: zeta >= 1 on A_{b*} and its sharpness.
# Points are theta = theta* + delta * v with ||v|| = 1; each sphere fixes delta.
output = "results/regional_bound"
b_star = [0.0, -0.5, -1.0, -2.0, -3.0, -4.0]
alpha = [0.0, 0.01, 0.1, 0.3, 0.5, 0.9]
# A_C grows with C, so the theorem's largest threshold covers every admissible C.
C = 0.8

# Relative distances d = delta / ||theta*||: geometric below the switch, linear above.
# The outer radius must exceed the region; the audit requires an empty outer sphere.
# The smallest sphere is a sampling choice, not an eligibility cutoff.
distance_min = 1e-10
distance_switch = 0.1
spheres_per_decade = 6
distance_step = 0.025
distance_max = 1.3

# Sphere directions: angle chi from v_min (logarithmic near zero, then linear) and
# azimuth omega in [0, pi]; omega and pi - omega are mirror images in w_perp.
chi_min = 1e-10
chi_log_points = 90
chi_linear_points = 90
omega_points = 49
refine_levels = 2
refine_points = 15

# Independent rechecks of every sphere minimum against the mpmath oracle:
# relative for scaled-residual gaps; moment-polynomial gaps may add gap_atol in zeta. The
# adaptive integrator must agree with the oracle within its own error estimate.
precise_digits = 40
gap_rtol = 1e-7
gap_atol = 1e-12
loss_rtol = 1e-9
